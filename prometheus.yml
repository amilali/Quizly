global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-boot-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['quizly-backend:8081'] # Using docker service name if it matches, wait... backend port is 8081
        # The container_name in docker-compose is quizly-backend. 
        # But inside compose network, the service name is 'backend'.
        # I will use 'backend:8081'
      - targets: ['host.docker.internal:8081'] # Fallback if running from IDE
