global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-boot-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'backend:8081'            # Docker service name (primary - used inside Docker network)
          - 'host.docker.internal:8081' # Fallback for local dev outside Docker

  - job_name: 'spring-boot-backend-production'
    metrics_path: '/actuator/prometheus'
    scheme: https
    static_configs:
      - targets:
          - 'qwizly.javascript-dev.com' # Production domain proxied via Vercel → Ngrok → Backend
