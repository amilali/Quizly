spring.application.name=backend
server.port=8081

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/quizly
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Import environment variables
spring.config.import=optional:file:.env[.properties]

# Spring AI OpenRouter Configuration
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.options.model=nvidia/nemotron-3-ultra-550b-a55b:free
spring.ai.openai.chat.options.max-tokens=1500
spring.ai.openai.embedding.options.model=nvidia/llama-nemotron-embed-vl-1b-v2:free

# Spring AI pgvector Configuration
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536

spring.ai.vectorstore.pgvector.initialize-schema=true

# Actuator & Observability Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Micrometer Metrics (Prometheus)
management.metrics.tags.application=${spring.application.name}

# Micrometer Tracing (OTLP)
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
